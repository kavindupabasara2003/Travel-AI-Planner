services:

  # 1. PostgreSQL + pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: travel-ai-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: travel_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d travel_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 2. Redis (Celery broker + result backend)
  redis:
    image: redis:7-alpine
    container_name: travel-ai-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 3. Django Backend (API server)
  api:
    build: ./backend
    container_name: travel-ai-backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=travel_ai
      - DB_USER=admin
      - DB_PASSWORD=admin
      - OLLAMA_HOST=http://host.docker.internal:11434
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOW_ALL=True
    restart: unless-stopped

  # 4. Celery Worker (async itinerary generation)
  celery:
    build: ./backend
    container_name: travel-ai-celery
    command: celery -A travel_ai_backend worker --loglevel=info --concurrency=2 -Q celery
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=travel_ai
      - DB_USER=admin
      - DB_PASSWORD=admin
      - OLLAMA_HOST=http://host.docker.internal:11434
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOW_ALL=True
    restart: unless-stopped

  # 5. Vue Frontend (Caddy serving built assets + reverse-proxying /api to backend)
  frontend:
    build: ./frontend
    container_name: travel-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
